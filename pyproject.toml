[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopmind-ai"
version = "0.1.0"
description = "Multimodal e-commerce recommendation and AI shopping assistant"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "numpy>=1.26",
  "pandas>=2.1",
  "pillow>=10.0",
  "plotly>=5.20",
  "pydantic>=2.6",
  "scikit-learn>=1.4",
  "streamlit>=1.32",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "openpyxl>=3.1", "ruff>=0.4"]
ml = ["lightgbm>=4.3", "sentence-transformers>=3.0", "faiss-cpu>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

